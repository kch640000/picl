<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BRAVE 영어 말하기 인식 조사</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --ink:#1c2430; --muted:#5b6876;
    --line:#dfe5ec; --brand:#1565c0; --brand-soft:#e8f0fb;
    --b:#e8342c; --r:#e8720c; --a:#1e9e57; --v:#1565c0; --e:#7b2fbe;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"Pretendard","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
       -webkit-text-size-adjust:100%}
  .wrap{max-width:720px;margin:0 auto;padding:16px}
  header{background:linear-gradient(135deg,#1565c0,#4a3fb5);color:#fff;
         border-radius:16px;padding:22px 20px;margin-bottom:14px}
  .brave{font-size:26px;font-weight:800;letter-spacing:1px;margin-bottom:6px}
  .brave i{font-style:normal}
  .brave .c1{color:#ffd3d0}.brave .c2{color:#ffe0bd}.brave .c3{color:#c6f2d8}
  .brave .c4{color:#d3e6ff}.brave .c5{color:#e6d4fb}
  header h1{font-size:17px;margin:0 0 8px;font-weight:700}
  header p{margin:0;font-size:13px;line-height:1.6;opacity:.92}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:16px;margin-bottom:12px}
  .sec{display:flex;align-items:center;gap:8px;margin:22px 2px 10px;font-weight:800;font-size:15px;color:var(--brand)}
  .sec span{display:inline-block;background:var(--brand-soft);color:var(--brand);
            border-radius:8px;padding:3px 9px;font-size:12px}
  label.f{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
  input[type=text],select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);
       border-radius:10px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
  textarea{min-height:92px;resize:vertical;line-height:1.6}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .q{font-size:15px;line-height:1.55;font-weight:600;margin:0 0 12px}
  .q b{color:var(--brand);margin-right:6px}
  .scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .scale button{border:1px solid var(--line);background:#fff;border-radius:10px;
       padding:10px 2px 8px;cursor:pointer;font-family:inherit;transition:.12s;
       display:flex;flex-direction:column;align-items:center;gap:4px}
  .scale button .n{font-size:17px;font-weight:800;color:var(--muted)}
  .scale button .t{font-size:10.5px;color:var(--muted);line-height:1.25;text-align:center}
  .scale button:hover{border-color:#b8c6d8}
  .scale button.on{background:var(--brand);border-color:var(--brand)}
  .scale button.on .n,.scale button.on .t{color:#fff}
  .legend{font-size:12px;color:var(--muted);text-align:center;margin:10px 0 2px}
  .bar{position:sticky;bottom:0;background:rgba(244,246,249,.96);backdrop-filter:blur(6px);
       padding:12px 0 16px;margin-top:6px}
  .prog{height:7px;background:#e3e9f0;border-radius:99px;overflow:hidden;margin-bottom:10px}
  .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1e9e57,#1565c0);transition:.25s}
  .cnt{font-size:12px;color:var(--muted);text-align:center;margin-bottom:8px}
  button.submit{width:100%;padding:15px;border:0;border-radius:12px;background:var(--brand);
       color:#fff;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer}
  button.submit:disabled{background:#b3bfcd;cursor:not-allowed}
  .done{text-align:center;padding:60px 20px}
  .done .big{font-size:46px;margin-bottom:14px}
  .done h2{margin:0 0 8px;font-size:20px}
  .done p{color:var(--muted);font-size:14px;line-height:1.7;margin:0}
  .err{color:#c62828;font-size:13px;text-align:center;margin-top:8px;min-height:18px}
  .hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.55}
  @media(max-width:420px){ .scale button .t{display:none} .scale button{padding:13px 2px} }
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <div class="brave"><i class="c1">Ⓑ</i><i class="c2">Ⓡ</i><i class="c3">Ⓐ</i><i class="c4">Ⓥ</i><i class="c5">Ⓔ</i></div>
    <h1 style="font-size:19px;margin:0 0 6px">덜 떨고, 더 말하는 영어 교실</h1>
    <p style="margin:0 0 8px;font-size:15px;font-weight:700">영어 말하기에 대한 생각 조사</p>
    <p>이 조사는 성적과 전혀 관계가 없어요. 정답도 없습니다.<br>지금 여러분의 생각을 솔직하게 골라 주세요. 5분이면 끝납니다.</p>
  </header>

  <div class="card">
    <div class="grid3" style="margin-bottom:10px">
      <div><label class="f">학년</label><select id="grade"><option value="2">2학년</option><option value="1">1학년</option><option value="3">3학년</option></select></div>
      <div><label class="f">반</label><input type="text" id="cls" inputmode="numeric" placeholder="예: 3"></div>
      <div><label class="f">번호</label><input type="text" id="num" inputmode="numeric" placeholder="예: 12"></div>
    </div>
    <label class="f">이름</label>
    <input type="text" id="name" placeholder="이름을 적어 주세요">
    <div style="margin-top:10px"><label class="f">조사 시기</label>
      <select id="phase"><option value="사전">사전 (수업 시작 전)</option><option value="사후">사후 (8차시 끝난 뒤)</option></select></div>
    <div class="hint"><b>학년·반·번호·이름을 모두 정확히 적어 주세요.</b> 수업 전과 후의 응답을 한 사람씩 짝지어 비교하기 위해 꼭 필요합니다. 응답은 담당 선생님만 확인하며 수업 개선 연구에만 사용되고, 성적과 전혀 관계가 없습니다.</div>
  </div>

  <div class="legend">① 전혀 아니다 · ② 아니다 · ③ 보통이다 · ④ 그렇다 · ⑤ 매우 그렇다</div>
  <div id="items"></div>

  <div class="bar">
    <div class="prog"><i id="pbar"></i></div>
    <div class="cnt" id="cnt">0 / 20 문항</div>
    <button class="submit" id="go" disabled>제출하기</button>
    <div class="err" id="err"></div>
  </div>
</div>

<script>
const LIK=[["①","전혀\n아니다"],["②","아니다"],["③","보통\n이다"],["④","그렇다"],["⑤","매우\n그렇다"]];
const SECTIONS=[
 {t:"1부. 영어로 말할 때의 나",tag:"문항 1~4",items:[
  "나는 영어로 말할 때 내가 아는 표현을 자신 있게 사용할 수 있다.",
  "나는 교재를 보지 않고도 배운 표현을 떠올려 말할 수 있다.",
  "내 영어 발음은 듣는 사람에게 충분히 전달될 만하다고 생각한다.",
  "나는 친구들 앞에서 영어로 말하는 것이 편하다."]},
 {t:"2부. 영어로 말할 때의 부담",tag:"문항 5~8",items:[
  "나는 영어로 말할 때 틀릴까 봐 걱정된다.",
  "영어 말하기 수행평가를 생각하면 긴장된다.",
  "친구들이 내 영어 발음을 듣는 것이 부담스럽다.",
  "영어로 말해야 하는 상황이 오면 피하고 싶어진다."]},
 {t:"3부. 나의 연습 방식",tag:"문항 9~12",items:[
  "영어 말하기가 잘 안 되면 나는 스스로 다시 연습해 본다.",
  "피드백을 받으면 무엇을 고쳐야 할지 스스로 찾을 수 있다.",
  "수업 시간이 아니어도 영어로 말하기를 연습할 생각이 있다.",
  "내 영어 말하기 실력이 지금 어느 정도인지 스스로 점검할 수 있다."]}
];
const OPENS=[
 "영어로 말할 때 가장 어렵게 느껴지는 점은 무엇인가요?",
 "PHASE_Q",
 "앞으로 영어 말하기를 어떻게 연습해 보고 싶나요?"];
const OPEN_PRE="영어 말하기를 연습할 때 어떤 도움이 있으면 좋겠나요?";
const TOOL_POST=[
 "피클은 따로 배우지 않아도 쉽게 사용할 수 있었다.",
 "피클은 내가 말한 영어를 정확하게 알아듣고 글로 옮겨 주었다.",
 "우리 반이 다 같이 사용할 때도 끊기거나 느려지지 않았다.",
 "피클이 알려 준 정확성·유창성 점수는 수업에서 배운 내용과 연결되어, 무엇을 고쳐야 할지 알 수 있었다.",
 "다음에 다른 단원을 배울 때도 피클로 말하기 연습을 하면 좋겠다."];
const TOOL_PRE=[
 "AI 학습 도구는 따로 배우지 않아도 쉽게 사용할 수 있을 것 같다.",
 "AI 학습 도구는 내가 말한 영어를 정확하게 알아듣고 글로 옮겨 줄 것 같다.",
 "우리 반이 다 같이 사용해도 끊기거나 느려지지 않을 것 같다.",
 "AI가 알려 주는 발음 점수는 수업에서 배운 내용과 연결되어, 무엇을 고쳐야 할지 알려 줄 것 같다.",
 "앞으로 영어 단원을 배울 때 AI 도구로 말하기 연습을 하면 좋겠다."];
const OPEN_POST="피클로 말하기를 연습하고 짝과 역할극을 한 것이 도움이 된 점과 아쉬웠던 점을 각각 써 주세요.";

const ans={}; let n=0;
const box=document.getElementById('items');
SECTIONS.forEach(sec=>{
  const h=document.createElement('div'); h.className='sec';
  h.innerHTML=sec.t+' <span>'+sec.tag+'</span>'; box.appendChild(h);
  sec.items.forEach(txt=>{
    n++; const i=n;
    const c=document.createElement('div'); c.className='card';
    c.innerHTML='<p class="q"><b>'+i+'.</b>'+txt+'</p>';
    const s=document.createElement('div'); s.className='scale';
    LIK.forEach((L,k)=>{
      const b=document.createElement('button'); b.type='button';
      b.innerHTML='<span class="n">'+L[0]+'</span><span class="t">'+L[1].replace('\n','<br>')+'</span>';
      b.onclick=()=>{ ans['q'+i]=k+1;
        [...s.children].forEach(x=>x.classList.remove('on')); b.classList.add('on'); upd(); };
      s.appendChild(b);
    });
    c.appendChild(s); box.appendChild(c);
  });
});
const oh=document.createElement('div'); oh.className='sec';
oh.innerHTML='4부. 자유롭게 써 주세요 <span>문항 13~15</span>'; box.appendChild(oh);
OPENS.forEach((txt,k)=>{
  const i=13+k;
  const c=document.createElement('div'); c.className='card';
  c.innerHTML='<p class="q"><b>'+i+'.</b><span id="qt'+i+'">'+
     (txt==='PHASE_Q'?OPEN_PRE:txt)+'</span></p>';
  const ta=document.createElement('textarea'); ta.placeholder='한두 문장이면 충분해요.';
  ta.oninput=()=>{ ans['q'+i]=ta.value.trim(); upd(); };
  c.appendChild(ta); box.appendChild(c);
});
const th=document.createElement('div'); th.className='sec';
th.innerHTML='5부. 학습 도구에 대한 생각 <span>문항 16~20</span>'; box.appendChild(th);
const toolNote=document.createElement('div'); toolNote.className='card';
toolNote.style.background='#f0f5fb'; toolNote.style.borderColor='#c9dcf2';
toolNote.innerHTML='<div class="hint" id="toolnote" style="margin:0"></div>';
box.appendChild(toolNote);
TOOL_POST.forEach((_,k)=>{
  const i=16+k;
  const c=document.createElement('div'); c.className='card';
  c.innerHTML='<p class="q"><b>'+i+'.</b><span id="qt'+i+'"></span></p>';
  const sc=document.createElement('div'); sc.className='scale';
  LIK.forEach((L,j)=>{
    const b=document.createElement('button'); b.type='button';
    b.innerHTML='<span class="n">'+L[0]+'</span><span class="t">'+L[1].replace('\n','<br>')+'</span>';
    b.onclick=()=>{ ans['q'+i]=j+1; [...sc.children].forEach(x=>x.classList.remove('on')); b.classList.add('on'); upd(); };
    sc.appendChild(b);
  });
  c.appendChild(sc); box.appendChild(c);
});
function isPost(){ return document.getElementById('phase').value==='사후'; }
function applyPhase(){
  const post=isPost();
  document.getElementById('qt14').textContent = post?OPEN_POST:OPEN_PRE;
  const src = post?TOOL_POST:TOOL_PRE;
  for(let k=0;k<5;k++){ document.getElementById('qt'+(16+k)).textContent = src[k]; }
  document.getElementById('toolnote').innerHTML = post
    ? '수업에서 사용해 본 <b>피클</b>을 떠올리며 답해 주세요.'
    : '아직 써 보기 전이지요? <b>앞으로 어떨 것 같은지 기대를 담아</b> 답하면 됩니다. 정답이 없어요.';
}
document.getElementById('phase').addEventListener('change', ()=>{ applyPhase(); });
applyPhase();
function upd(){
  const total = 20;
  let d=0; for(let i=1;i<=total;i++){ const v=ans['q'+i]; if(v!==undefined&&v!=='') d++; }
  document.getElementById('pbar').style.width=(d/total*100)+'%';
  document.getElementById('cnt').textContent=d+' / 20 문항';
  document.getElementById('go').disabled = d<total;
}
document.getElementById('go').onclick=()=>{
  const g=document.getElementById('grade').value, c=document.getElementById('cls').value.trim(),
        nu=document.getElementById('num').value.trim(), nm=document.getElementById('name').value.trim(),
        ph=document.getElementById('phase').value;
  const e=document.getElementById('err');
  if(!c||!nu||!nm){ e.textContent='반, 번호, 이름을 모두 적어 주세요.'; return; }
  e.textContent='';
  const btn=document.getElementById('go'); btn.disabled=true; btn.textContent='보내는 중...';
  const payload={grade:g,cls:c,num:nu,name:nm,phase:ph};
  for(let i=1;i<=20;i++) payload['q'+i]=(ans['q'+i]!==undefined?ans['q'+i]:'');
  if(typeof google!=='undefined'&&google.script&&google.script.run){
    google.script.run.withSuccessHandler(done)
      .withFailureHandler(err=>{ e.textContent='전송에 실패했어요. 다시 눌러 주세요.';
        btn.disabled=false; btn.textContent='제출하기'; })
      .saveResponse(payload);
  } else { setTimeout(done,500); }   // 미리보기 모드
};
function done(){
  document.getElementById('app').innerHTML=
   '<div class="done"><div class="big">🎉</div><h2>제출되었습니다</h2>'+
   '<p>솔직하게 답해 주어 고맙습니다.<br>여러분의 응답은 더 좋은 수업을 만드는 데 쓰입니다.</p></div>';
  window.scrollTo(0,0);
}
</script>
</body>
</html>
